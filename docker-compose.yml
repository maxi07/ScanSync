x-analytics-environment: &analytics-environment
  ANALYTICS_URL: ${ANALYTICS_URL:-}
  ANALYTICS_API_KEY: ${ANALYTICS_API_KEY:-}

services:    
  smb_service:
    build:
      context: ./smb_service
      args:
        - APP_VERSION=${APP_VERSION:-dev}
    container_name: smb_service
    ports:
      - "137:137/udp"
      - "138:138/udp"
      - "139:139"
      - "445:445"
    volumes:
      - scans:/shares/Scans
    restart: unless-stopped
    networks:
      - app-network

  ocr_service:
    build:
      context: .
      dockerfile: ocr_service/Dockerfile
      args:
        - APP_VERSION=${APP_VERSION:-dev}
    environment:
      <<: *analytics-environment
      SCANSYNC_SERVICE: ocr_service
    restart: unless-stopped
    volumes:
      - scans:/mnt/scans
      - data:/app/data
    networks:
      - app-network
    depends_on:
      web-service:
        condition: service_healthy
      smb_service:
        condition: service_started
      rabbitmq:
        condition: service_healthy
    deploy:
      mode: replicated
      replicas: 2
    command: ["python", "main.py"]

  file_naming_service:
    build:
      context: .
      dockerfile: file_naming_service/Dockerfile
      args:
        - APP_VERSION=${APP_VERSION:-dev}
    environment:
      <<: *analytics-environment
      SCANSYNC_SERVICE: file_naming_service
    restart: unless-stopped
    volumes:
      - scans:/mnt/scans
      - data:/app/data
    networks:
      - app-network
    depends_on:
      web-service:
        condition: service_healthy
      smb_service:
        condition: service_started
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_started
    extra_hosts:
      - "host.docker.internal:host-gateway"
    deploy:
      mode: replicated
      replicas: 1
    command: ["python", "main.py"]

  detection_service:
    build:
      context: .
      dockerfile: detection_service/Dockerfile
      args:
        - APP_VERSION=${APP_VERSION:-dev}
    environment:
      <<: *analytics-environment
      SCANSYNC_SERVICE: detection_service
    container_name: detection_service
    restart: unless-stopped
    volumes:
      - scans:/mnt/scans
      - data:/app/data
    networks:
      - app-network
    depends_on:
      web-service:
        condition: service_healthy
      smb_service:
        condition: service_started
      rabbitmq:
        condition: service_healthy
    command: ["python", "main.py"]
  
  metadata_service:
    build:
      context: .
      dockerfile: metadata_service/Dockerfile
      args:
        - APP_VERSION=${APP_VERSION:-dev}
    environment:
      <<: *analytics-environment
      SCANSYNC_SERVICE: metadata_service
    restart: unless-stopped
    volumes:
      - scans:/mnt/scans
      - preview-images:/app/preview-images
      - data:/app/data
    networks:
      - app-network
    depends_on:
      web-service:
        condition: service_healthy
      smb_service:
        condition: service_started
      rabbitmq:
        condition: service_healthy
    deploy:
      mode: replicated
      replicas: 2
    command: ["python", "main.py"]
  
  upload_service:
    build:
      context: .
      dockerfile: upload_service/Dockerfile
      args:
        - APP_VERSION=${APP_VERSION:-dev}
    environment:
      <<: *analytics-environment
      SCANSYNC_SERVICE: upload_service
    container_name: upload_service
    restart: unless-stopped
    volumes:
      - scans:/mnt/scans
      - data:/app/data
    networks:
      - app-network
    depends_on:
      web-service:
        condition: service_healthy
      smb_service:
        condition: service_started
      rabbitmq:
        condition: service_healthy
    command: ["python", "main.py"]
  
  web-service:
    restart: unless-stopped
    build:
      context: .
      dockerfile: web_service/Dockerfile
      args:
        - APP_VERSION=${APP_VERSION:-dev}
    ports:
      - "${WEB_PORT:-5001}:5001"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      <<: *analytics-environment
      SCANSYNC_SERVICE: web_service
      FLASK_ENV: prod # prod or development
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5001/health')"]
      interval: 60s
      timeout: 10s
      retries: 2
      start_period: 30s
      start_interval: 3s
    depends_on:
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - scans:/mnt/scans
      - data:/app/data
      - preview-images:/app/src/static/images/pdfpreview
    networks:
      - app-network

  rabbitmq:
    image: "rabbitmq:4.4.0-management"
    restart: unless-stopped
    container_name: "rabbitmq"
    environment:
      - TZ=Europe/Berlin
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD-SHELL", "rabbitmq-diagnostics -q check_running && rabbitmq-diagnostics -q check_port_connectivity"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks:
      - app-network
    volumes:
      - ./rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro

  redis:
    image: redis:8.10.3
    restart: unless-stopped
    container_name: redis
    ports:
      - "6379:6379"
    networks:
      - app-network
    volumes:
      - redis_data:/data
    command: ["redis-server", "--save", "60", "1", "--appendonly", "yes"]

volumes:
  scans:
  preview-images:
  data:
  redis_data:

networks:
  app-network: