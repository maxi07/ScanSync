[build-system]
requires = ["setuptools>=79.0"]
build-backend = "setuptools.build_meta"

[project]
name = "scansynclib"
version = "0.1.0"
description = "Shared helper library for ScanSync"
dependencies = ["colorlog==6.12.0", "tenacity==9.2.1", "pika==1.4.4", "openai==3.46.0", "msal==1.39.0", "pypdf==7.0.0", "redis==8.1.0"]
requires-python = ">=3.13"

[tool.setuptools]
packages = ["scansynclib"]

[tool.setuptools.package-dir]
"" = "."