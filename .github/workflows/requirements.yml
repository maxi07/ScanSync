name: Merge Requirements

on:
  push:
    branches:
      - main
    paths:
      - '**/*.py'
      - '**/requirements.txt'
      - 'scansynclib/pyproject.toml'
      - 'Makefile'
  workflow_dispatch:
  
permissions:
  contents: write

jobs:
  merge-requirements:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: |
            **/requirements.txt
            scansynclib/pyproject.toml
            requirements-dev.txt

      - name: Install system dependencies
        run: sudo apt-get install -y libxml2-dev libxslt-dev

      - name: Install pip-tools
        run: pip install pip-tools

      - name: Find and merge all requirements.txt files
        run: |
          make deps-lock PYTHON=python
          pip install --dry-run -r requirements-dev.txt

      - name: Commit and push requirements-dev.txt
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add requirements-dev.txt
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git add requirements-dev.txt
            git commit -m "Update requirements-dev.txt [ci-skip-auto]"
            git push origin main
          fi