name: Run Tests

on:
  push:
    branches:
      - main
    paths:
      - '**/*.py'
      - '**/requirements.txt'
      - '**/Dockerfile'
      - 'scansynclib/pyproject.toml'
      - 'requirements-dev.txt'
      - 'docker-compose*.yml'
      - 'Makefile'
      - 'run-tests.sh'
      - '.dockerignore'
      - 'web_service/src/templates/**'
      - '.github/workflows/pytest.yml'
  pull_request:
    branches:
      - main
    paths:
      - '**/*.py'
      - '**/requirements.txt'
      - '**/Dockerfile'
      - 'scansynclib/pyproject.toml'
      - 'requirements-dev.txt'
      - 'docker-compose*.yml'
      - 'Makefile'
      - 'run-tests.sh'
      - '.dockerignore'
      - 'web_service/src/templates/**'
      - '.github/workflows/pytest.yml'

jobs:
  run-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set execute permission for run-tests.sh
        run: chmod +x ./run-tests.sh

      - name: Run tests
        run: make test